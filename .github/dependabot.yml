# Dependabot (Fase D, 0.3.1): avisa de versiones nuevas de las dependencias de Composer y de las acciones del CI.
# La librería no versiona composer.lock, así que solo propone cambios cuando una versión nueva queda fuera de la
# restricción declarada en composer.json.
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencias]
    commit-message:
      prefix: "build(deps)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencias]
    commit-message:
      prefix: "ci(deps)"
