name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: PHP ${{ matrix.php }}${{ matrix.experimental && ' (experimental)' || '' }}
    runs-on: ubuntu-latest
    # PHP 8.5 es experimental (Fase D, 0.3.1): corre pero no bloquea el PR hasta que la suite lo apruebe de forma estable.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
        experimental: [false]
        include:
          - php: '8.5'
            experimental: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: soap, dom, zip, bcmath, openssl, mbstring
          # Cobertura solo en el job de 8.3 (el de referencia); en los demás, sin instrumentación.
          coverage: ${{ matrix.php == '8.3' && 'xdebug' || 'none' }}

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Lint PHP sources
        run: find src test tests tools -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Code style (php-cs-fixer)
        if: matrix.php == '8.3'
        run: vendor/bin/php-cs-fixer check --diff

      - name: PHPUnit
        if: matrix.php != '8.3'
        run: vendor/bin/phpunit

      - name: PHPUnit with coverage
        if: matrix.php == '8.3'
        run: |
          vendor/bin/phpunit --coverage-clover build/clover.xml
          php tools/cobertura-minima.php build/clover.xml ${{ env.COBERTURA_MINIMA }}
        env:
          XDEBUG_MODE: coverage
          # Umbral de cobertura de líneas (D11): 5 puntos por debajo de lo medido al fijarlo; subirlo cuando crezca.
          COBERTURA_MINIMA: '75'

      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=1G

      - name: Composer audit
        if: matrix.php == '8.3'
        run: composer audit
